name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK
        run: |
          cd public
          export JAVA_HOME=$JAVA_HOME_17_X64
          
          # خطوة هامة: إنشاء ملف الإعدادات المفقود آلياً لتجنب الخطأ الظاهر في صورتك
          echo "{}" > twa-manifest.json 
          
          # الرد بـ "yes" على كل شيء وتجاوز الأسئلة
          yes | bubblewrap init --manifest=manifest.json --no-prompt || true
          yes | bubblewrap build --no-prompt || true
          
          # صيد ملف الـ APK ورفعه للمستوى الأعلى
          find . -name "*.apk" -exec mv {} ../AbuZahra_App.apk \;
          cd ..

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuZahra-Final-App
          path: AbuZahra_App.apk
          if-no-files-found: error

