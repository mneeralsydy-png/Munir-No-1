name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK
        run: |
          cd public
          # تحديد مسار الجافا يدوياً للأداة لتجنب السؤال التفاعلي
          export JAVA_HOME=$JAVA_HOME_17_X64
          # الرد آلياً بـ "نعم" على اتفاقية الاستخدام وبناء التطبيق
          echo "y" | bubblewrap init --manifest=manifest.json --no-prompt || true
          echo "y" | bubblewrap build --no-prompt || true
          
          # التأكد من وجود الملف ونقله لمكان ثابت
          mkdir -p ../output
          find . -name "*.apk" -exec cp {} ../output/app-release.apk \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuZahra-Final-App
          # المسار الجديد الذي ضمنا نقل الملف إليه
          path: output/app-release.apk
          if-no-files-found: error
          
