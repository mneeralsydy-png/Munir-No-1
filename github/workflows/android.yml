name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK
        run: |
          cd public
          export JAVA_HOME=$JAVA_HOME_17_X64
          
          # 1. إنشاء الملف الذي تسبب في الخطأ في الصورة 37
          echo "{}" > twa-manifest.json 
          
          # 2. بناء التطبيق مع تخطي كل الأسئلة
          yes | bubblewrap init --manifest=manifest.json --no-prompt || true
          yes | bubblewrap build --no-prompt || true
          
          # 3. صيد الملف: ابحث عن أي ملف ينتهي بـ .apk وانقله للواجهة
          find . -name "*.apk" -exec mv {} ../AbuZahra_Final.apk \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-App
          # المسار الذي نقلنا إليه الملف في الخطوة السابقة
          path: AbuZahra_Final.apk
          if-no-files-found: error
          
