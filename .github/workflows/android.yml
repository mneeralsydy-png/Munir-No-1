name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK
        run: |
          # الدخول لمجلد بوبليك وتجاوز كل الأسئلة بكلمة yes
          cd public
          yes | bubblewrap init --manifest=manifest.json --no-prompt || true
          yes | bubblewrap build --no-prompt || true
          # البحث عن الملف ونقله للمكان الصحيح للرفع
          find . -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/app-release.apk \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuZahra-Final-App
          path: app-release.apk
          
