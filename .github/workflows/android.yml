name: Abu Zahra Final Fix 4.2.2

on:
  push:
    branches: [ "main", "Push" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Clean & Reset Android
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/contacts --force
          rm -rf android
          echo '{"appId": "com.munir.abuzahra", "appName": "Abu Zahra", "webDir": "public"}' > capacitor.config.json
          npx cap add android

      - name: Correct Manifest Injection
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # إضافة الأذونات بشكل آمن وبسيط
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_CONTACTS" />' $MANIFEST
          sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />' $MANIFEST
          sed -i '/<application/i \    <uses-permission android:name="android.permission.CALL_PHONE" />' $MANIFEST
          
          # حل مشكلة العودة من جوجل (جزء Intent Filter)
          # قمت بتبسيط الأمر لضمان عدم حدوث خطأ في الرموز
          sed -i '/<activity/a \            <intent-filter><action android:name="android.intent.action.VIEW" /><category android:name="android.intent.category.DEFAULT" /><category android:name="android.intent.category.BROWSABLE" /><data android:scheme="com.munir.abuzahra" /></intent-filter>' $MANIFEST

      - name: Versioning & Dependency Fix
        run: |
          # تحديث الإصدار لـ 4.2.2
          GRADLE="android/app/build.gradle"
          sed -i 's/versionCode [0-9]*/versionCode 40202/' $GRADLE
          sed -i 's/versionName "[^"]*"/versionName "4.2.2"/' $GRADLE
          
          # القضاء على تكرار المكتبات Duplicate Class
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          printf "\nallprojects {\n    configurations.all {\n        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'\n    }\n}\n" >> android/build.gradle
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x test --no-daemon

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-v4.2.2-SUCCESS
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
