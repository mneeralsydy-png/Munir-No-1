name: Abu Zahra Pro Build 4.1.5

on:
  push:
    branches: [ "main", "Push" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Full Clean Install
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/contacts --force
          echo '{"appId": "com.munir.abuzahra", "appName": "Abu Zahra", "webDir": "public"}' > capacitor.config.json
          npx cap add android || true
          
      - name: Inject Pro Features & Permissions
        run: |
          # 1. إضافة كل الأذونات (أسماء، اتصال، حالة هاتف)
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i <uses-permission android:name="android.permission.READ_CONTACTS" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.WRITE_CONTACTS" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.CALL_PHONE" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.READ_PHONE_STATE" />' $MANIFEST
          
          # 2. تحديث الإصدار إلى 4.1.5 (رقم الإصدار البرمجي 40105)
          GRADLE="android/app/build.gradle"
          sed -i 's/versionCode [0-9]*/versionCode 40105/' $GRADLE
          sed -i 's/versionName "[^"]*"/versionName "4.1.5"/' $GRADLE
          
          # 3. حل مشكلة تكرار المكتبات النهائية (Jetifier)
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # توحيد إصدار Kotlin لمنع خطأ Duplicate class
          printf "allprojects {\n    configurations.all {\n        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'\n    }\n}\n" >> android/build.gradle
          
          npx cap sync android

      - name: Build Pro APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x test --no-daemon

      - name: Upload Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-v4.1.5-PRO
          path: android/app/build/outputs/apk/debug/app-debug.apk
