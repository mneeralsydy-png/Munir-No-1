name: Abu Zahra Pro Internal 4.3.0

on:
  push:
    branches: [ "main", "Push" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Reset & Install Native Plugins
        run: |
          # تثبيت المكتبات المسؤولة عن تسجيل الدخول الداخلي (Native)
          npm install @capacitor/cli @capacitor/core @capacitor/android --force
          npm install @capacitor-community/contacts @codetrix-studio/capacitor-google-auth --force
          rm -rf android
          echo '{"appId": "com.munir.abuzahra", "appName": "Abu Zahra", "webDir": "public"}' > capacitor.config.json
          npx cap add android

      - name: Create Native Styles
        run: |
          VALUES_DIR="android/app/src/main/res/values"
          mkdir -p $VALUES_DIR
          cat <<EOF > $VALUES_DIR/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">#3F51B5</item>
                  <item name="colorPrimaryDark">#303F9F</item>
                  <item name="colorAccent">#FF4081</item>
              </style>
              <style name="AppTheme.NoActionBarLauncher" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@null</item>
              </style>
          </resources>
          EOF

      - name: Write Native AndroidManifest
        run: |
          # المانيفست الآن مهيأ لدعم الأذونات وتسجيل الدخول الداخلي
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.WRITE_CONTACTS" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  
                  <meta-data android:name="com.google.android.gms.version" android:value="@integer/google_play_services_version" />

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name="com.munir.abuzahra.MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLauncher"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Fix Dependencies & Version
        run: |
          # القضاء على Duplicate Class المزعج
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "kotlin.stdlib.default.dependency=false" >> android/gradle.properties
          
          printf "\nallprojects {\n    configurations.all {\n        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'\n    }\n}\n" >> android/build.gradle
          
          # تحديث الإصدار لـ 4.3.0
          sed -i 's/versionCode [0-9]*/versionCode 40300/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "4.3.0"/' android/app/build.gradle
          npx cap sync android

      - name: Build Pro APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x test --no-daemon

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-v4.3.0-NATIVE
          path: android/app/build/outputs/apk/debug/app-debug.apk
