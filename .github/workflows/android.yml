name: Abu Zahra Pro Master 4.2.7

on:
  push:
    branches: [ "main", "Push" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Deep Clean & Reset
        run: |
          # تنظيف كامل للمكتبات والملفات المؤقتة
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android @capacitor-community/contacts --force
          rm -rf android
          echo '{"appId": "com.munir.abuzahra", "appName": "Abu Zahra", "webDir": "public"}' > capacitor.config.json
          npx cap add android

      - name: Structural Fix - Styles & Themes
        run: |
          # حل خطأ الصورة رقم 16 (Resource AppTheme.NoActionBarLauncher not found)
          # سنقوم بإنشاء ملفات الموارد يدوياً لضمان وجودها
          RES_DIR="android/app/src/main/res/values"
          mkdir -p $RES_DIR
          cat <<EOF > $RES_DIR/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">#3F51B5</item>
                  <item name="colorPrimaryDark">#303F9F</item>
                  <item name="colorAccent">#FF4081</item>
              </style>
              <style name="AppTheme.NoActionBarLauncher" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@null</item>
              </style>
          </resources>
          EOF

      - name: Structural Fix - Android Manifest
        run: |
          # إعادة كتابة المانيفست بالكامل لحل مشكلة تسجيل جوجل والأذونات
          # سيتم تضمين الـ Intent Filter المفقود واللازم لعودة المتصفح
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          cat <<EOF > $MANIFEST
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.WRITE_CONTACTS" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name="com.munir.abuzahra.MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLauncher"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.munir.abuzahra" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Dependency Engineering
        run: |
          # حل مشكلة Duplicate Class (الصور 1-6 و 11 و 17)
          PROPS="android/gradle.properties"
          echo "android.useAndroidX=true" > $PROPS
          echo "android.enableJetifier=true" >> $PROPS
          
          # فرض نسخة Kotlin موحدة لإنهاء صراع المكتبات نهائياً
          BUILD_GRADLE="android/build.gradle"
          printf "\nallprojects {\n    configurations.all {\n        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'\n    }\n}\n" >> $BUILD_GRADLE
          
          # تحديث نسخة التطبيق
          sed -i 's/versionCode [0-9]*/versionCode 40207/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "4.2.7"/' android/app/build.gradle
          npx cap sync android

      - name: Master Build Process
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug -x test --no-daemon

      - name: Upload Final Success APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-v4.2.7-FINAL
          path: android/app/build/outputs/apk/debug/app-debug.apk
