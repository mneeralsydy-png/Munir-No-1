name: Abu Zahra Clean Build 4.2.5

on:
  push:
    branches: [ "main", "Push" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Reset Android Project
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/contacts --force
          rm -rf android
          echo '{"appId": "com.munir.abuzahra", "appName": "Abu Zahra", "webDir": "public"}' > capacitor.config.json
          npx cap add android

      - name: Writing Clean Manifest
        run: |
          # هنا نقوم بكتابة الملف بالكامل لضمان عدم وجود أخطاء XML كما في الصور السابقة
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.WRITE_CONTACTS" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name="com.munir.abuzahra.MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLauncher"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.munir.abuzahra" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Lock Dependencies (Fix Duplicate Class)
        run: |
          # هذا الجزء ينهي صراع المكتبات الذي ظهر في سجلاتك السابقة
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          printf "\nallprojects {\n    configurations.all {\n        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'\n    }\n}\n" >> android/build.gradle
          
          # تحديث نسخة التطبيق
          sed -i 's/versionCode [0-9]*/versionCode 40205/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "4.2.5"/' android/app/build.gradle
          npx cap sync android

      - name: Final Success Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x test --no-daemon

      - name: Upload Success APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-v4.2.5-FIXED
          path: android/app/build/outputs/apk/debug/app-debug.apk
