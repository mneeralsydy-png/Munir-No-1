name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK
        run: |
          # الدخول لمجلد بوبليك حيث يوجد ملف المانيفست
          cd public
          export JAVA_HOME=$JAVA_HOME_17_X64
          
          # إنشاء ملف الإعدادات المفقود آلياً لتجنب خطأ ENOENT
          echo "{}" > twa-manifest.json
          
          # بناء التطبيق مع تجاوز كل الأسئلة آلياً
          yes | bubblewrap init --manifest=manifest.json --no-prompt || true
          yes | bubblewrap build --no-prompt || true
          
          # صيد ملف الـ APK ونقله للخارج ليراه نظام الرفع
          find . -name "*.apk" -exec mv {} ../AbuZahra_Final.apk \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuZahra-Final-App
          path: AbuZahra_Final.apk
          if-no-files-found: error
          
