name: Abu Zahra Ultimate Permission Fix 4.1.7

on:
  push:
    branches: [ "main", "Push" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Clean & Force Install
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/contacts --force
          rm -rf android
          echo '{"appId": "com.munir.abuzahra", "appName": "Abu Zahra", "webDir": "public"}' > capacitor.config.json
          npx cap add android
          
      - name: Inject "Hard" Permissions Code
        run: |
          # 1. إضافة الأذونات لملف الـ Manifest
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i <uses-permission android:name="android.permission.READ_CONTACTS" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.WRITE_CONTACTS" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.CALL_PHONE" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.SEND_SMS" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.RECORD_AUDIO" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.READ_PHONE_STATE" />' $MANIFEST

          # 2. تعديل ملف الاستجابة البرمجية ليطلب الأذونات فوراً (Auto Request)
          # هذا الجزء يجعل التطبيق يظهر النوافذ المنبثقة (Pop-ups) إجبارياً
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # 3. تحديث رقم الإصدار ليظهر 4.1.7 لضمان قبول التحديث على جوالك
          GRADLE="android/app/build.gradle"
          sed -i 's/versionCode [0-9]*/versionCode 40107/' $GRADLE
          sed -i 's/versionName "[^"]*"/versionName "4.1.7"/' $GRADLE
          
          # 4. حل مشكلة التعارض (Duplicate Class)
          printf "allprojects {\n    configurations.all {\n        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'\n    }\n}\n" >> android/build.gradle
          
          npx cap sync android

      - name: Build Pro APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug -x test --no-daemon

      - name: Upload Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-v4.1.7-AutoPermissions
          path: android/app/build/outputs/apk/debug/app-debug.apk
