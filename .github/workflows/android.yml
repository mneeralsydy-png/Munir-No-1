name: Abu Zahra App - Version 3.9.60 Victory

on:
  push:
    branches: [ "main", "Push" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build & Set Version 3.9.60
        run: |
          # 1. تثبيت الإضافات والجسور
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/contacts --force
          
          # 2. إنشاء ملف الإعدادات مع الهوية الصحيحة
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.munir.abuzahra",
            "appName": "Abu Zahra",
            "webDir": "public"
          }
          EOF

          # 3. بناء منصة أندرويد
          npx cap add android || true
          
          # 4. حقن المانيفست المطور (الأذونات + حل شاشة جوجل البيضاء)
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.WRITE_CONTACTS" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Abu Zahra"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">
                  
                  <activity
                      android:name="com.munir.abuzahra.MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode">
                      
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.munir.abuzahra" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. تحديث رقم الإصدار إلى 3.9.60 برمجياً داخل ملف build.gradle
          sed -i 's/versionCode [0-9]*/versionCode 30960/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "3.9.60"/' android/app/build.gradle
          
          npx cap sync android

      - name: Build Final APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK 3.9.60
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-v3.9.60
          path: android/app/build/outputs/apk/debug/app-debug.apk
