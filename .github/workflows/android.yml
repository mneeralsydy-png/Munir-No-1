name: Abu Zahra Final Solution 4.2.6

on:
  push:
    branches: [ "main", "Push" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Reset & Clean Project
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/contacts --force
          rm -rf android
          echo '{"appId": "com.munir.abuzahra", "appName": "Abu Zahra", "webDir": "public"}' > capacitor.config.json
          npx cap add android

      - name: Create Missing Styles
        run: |
          # هذا الجزء يحل خطأ الصورة رقم 16 عبر إنشاء الستايل المفقود يدوياً
          VALUES_DIR="android/app/src/main/res/values"
          mkdir -p $VALUES_DIR
          cat <<EOF > $VALUES_DIR/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">#3F51B5</item>
                  <item name="colorPrimaryDark">#303F9F</item>
                  <item name="colorAccent">#FF4081</item>
              </style>
              <style name="AppTheme.NoActionBarLauncher" parent="AppTheme">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
              </style>
          </resources>
          EOF

      - name: Write Professional Manifest
        run: |
          # كتابة المانيفست بشكل يضمن حل مشكلة جوجل والأذونات
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.WRITE_CONTACTS" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name="com.munir.abuzahra.MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLauncher"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.munir.abuzahra" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Force Dependency Resolution
        run: |
          # حل مشكلة Duplicate Class نهائياً
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          printf "\nallprojects {\n    configurations.all {\n        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'\n    }\n}\n" >> android/build.gradle
          
          # تحديث نسخة التطبيق لضمان التنظيف
          sed -i 's/versionCode [0-9]*/versionCode 40206/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "4.2.6"/' android/app/build.gradle
          npx cap sync android

      - name: Execute Final Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x test --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-v4.2.6-SUCCESS
          path: android/app/build/outputs/apk/debug/app-debug.apk
