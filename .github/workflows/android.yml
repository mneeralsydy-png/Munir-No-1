name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK
        run: |
          cd public
          # أمر القوة: الرد بـ "Y" (نعم) على كل الأسئلة وتحديد مسار الـ JDK يدوياً
          export JAVA_HOME=$JAVA_HOME_17_X64
          yes | bubblewrap init --manifest=manifest.json --no-prompt || true
          yes | bubblewrap build --no-prompt || true
          
          # فحص إذا تم إنشاء ملفات (للتأكد)
          ls -R

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuZahra-Final-App
          # البحث في كل مكان عن أي ملف ينتهي بـ .apk
          path: "**/*.apk"
          if-no-files-found: error

