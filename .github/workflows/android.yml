name: Abu Zahra App Final Victory

on:
  push:
    branches: [ "main", "Push" ] # أضفنا Push لضمان العمل على فرعك الحالي
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build & Fix Permissions
        run: |
          # تنظيف وبناء بيئة Capacitor
          npm install @capacitor/cli @capacitor/core @capacitor/android --force
          
          # تهيئة التطبيق (استخدمنا public بدلاً من www)
          npx cap init Abu-Zahra com.example.abuzahra --web-dir public --no-confirm || true
          
          # إضافة منصة أندرويد (وإصلاحها إذا كانت موجودة)
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # تحديث ملف المانيفست (كما في فكرتك العبقرية لتفعيل الإنترنت)
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Abu Zahra"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name="com.example.abuzahra.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          npx cap sync android

      - name: Build Final APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Working APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-Final-Success
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
