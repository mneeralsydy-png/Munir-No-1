name: Abu Zahra App - Comprehensive Victory Fix

on:
  push:
    branches: [ "main", "Push" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build & Install All Solutions
        run: |
          # 1. تثبيت كافة الجسور (الأسماء + تسجيل الدخول + الميكروفون)
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/contacts @capacitor/browser --force
          
          # 2. تهيئة التطبيق بالهوية الصحيحة
          npx cap init "Abu Zahra" "com.munir.abuzahra" --web-dir public --no-confirm || true
          
          # 3. بناء منصة أندرويد
          rm -rf android
          npx cap add android
          
          # 4. حقن المانيفست المطور (حل الأذونات + حل شاشة جوجل البيضاء)
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.WRITE_CONTACTS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.SEND_SMS" />
              
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Abu Zahra"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">
                  
                  <activity
                      android:name="com.munir.abuzahra.MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode">
                      
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.munir.abuzahra" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # 5. مزامنة نهائية لربط كافة الأجزاء
          npx cap sync android

      - name: Build Final APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Comprehensive APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-Final-Victory
          path: android/app/build/outputs/apk/debug/app-debug.apk

