name: Abu Zahra Ultimate Pro 4.1.5

on:
  push:
    branches: [ "main", "Push" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Full Clean Install
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/contacts --force
          echo '{"appId": "com.munir.abuzahra", "appName": "Abu Zahra", "webDir": "public"}' > capacitor.config.json
          npx cap add android || true
          
      - name: Inject Pro Permissions & Version
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # إضافة الأذونات المطلوبة لتظهر وتُطلب تلقائياً
          sed -i '/<application/i <uses-permission android:name="android.permission.READ_CONTACTS" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.WRITE_CONTACTS" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.CALL_PHONE" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.SEND_SMS" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.READ_PHONE_STATE" />' $MANIFEST
          
          # تحديث رقم الإصدار إلى 4.1.5
          GRADLE="android/app/build.gradle"
          sed -i 's/versionCode [0-9]*/versionCode 40105/' $GRADLE
          sed -i 's/versionName "[^"]*"/versionName "4.1.5"/' $GRADLE
          
          # الحل النهائي والوحيد لتجاوز خطأ Duplicate Class (الاستبعاد القسري)
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> android/gradle.properties
          
          npx cap sync android

      - name: Build Pro APK
        run: |
          cd android
          chmod +x gradlew
          # أمر البناء السحري لتجاهل تعارض المكتبات وإتمام البناء بنجاح
          ./gradlew assembleDebug -Dorg.gradle.project.kotlin.stdlib.default.dependency=false --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-v4.1.5-FINAL
          path: android/app/build/outputs/apk/debug/app-debug.apk
