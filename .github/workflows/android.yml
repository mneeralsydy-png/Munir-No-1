name: Abu Zahra Final Fix v3.9.60

on:
  push:
    branches: [ "main", "Push" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install & Fix Dependencies
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/contacts --force
          npx cap sync android
          
          # هذا الأمر يحل مشكلة تكرار مكتبات Kotlin (Duplicate Class)
          echo "configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10' } }" >> android/build.gradle
          
          # ضبط رقم الإصدار 3.9.60
          sed -i 's/versionCode [0-9]*/versionCode 30960/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "3.9.60"/' android/app/build.gradle

      - name: Create Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Final APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-v3.9.60-FINAL
          path: android/app/build/outputs/apk/debug/app-debug.apk
