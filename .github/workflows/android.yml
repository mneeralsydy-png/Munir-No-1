name: Abu Zahra App Final Victory

on:
  push:
    branches: [ "main", "Push" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build & Fix Permissions
        run: |
          # 1. تثبيت الأدوات اللازمة
          npm install @capacitor/cli @capacitor/core @capacitor/android --force
          
          # 2. تهيئة التطبيق مع تحديد الهوية (appId) والاسم (appName) والمسار (webDir)
          # حل مشكلة الخطأ في الصورة 22
          npx cap init "Abu Zahra" "com.munir.abuzahra" --web-dir public
          
          # 3. إضافة منصة أندرويد
          npx cap add android
          
          # 4. تحديث الصلاحيات للإنترنت
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Abu Zahra"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name="com.munir.abuzahra.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          npx cap sync android

      - name: Build Final APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Working APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-Final-Success
          path: android/app/build/outputs/apk/debug/app-debug.apk

