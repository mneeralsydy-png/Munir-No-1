name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK (The Final Fix)
        run: |
          cd public
          export JAVA_HOME=$JAVA_HOME_17_X64
          
          # إزالة أي إعدادات قديمة تعيق العمل
          rm -f twa-manifest.json
          
          # إجبار الأداة على إنشاء ملف الإعدادات والرد بـ Yes على كل شيء
          # هذا السطر هو مفتاح الحل لكل الصور السابقة
          yes | bubblewrap init --manifest=manifest.json --no-prompt || true
          
          # أمر البناء مع إجبارية تخطي كلمة السر
          yes | bubblewrap build --no-prompt || true
          
          # الآن سنقوم بـ "مسح ذري" للمجلدات لإيجاد أي ملف apk
          echo "Looking for the generated file..."
          find . -name "*.apk" -exec cp {} ../AbuZahra_Final_App.apk \;
          cd ..

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbuZahra-App-Package
          # المسار الذي نقلنا إليه الملف يدوياً
          path: AbuZahra_Final_App.apk
          if-no-files-found: error

