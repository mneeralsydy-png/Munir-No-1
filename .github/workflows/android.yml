name: Abu Zahra App - Version 3.9.60 Ultimate Fix

on:
  push:
    branches: [ "main", "Push" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Clean & Build Capacitor
        run: |
          # 1. تثبيت نظيف للأدوات
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/contacts --force
          
          # 2. إنشاء ملف الإعدادات يدوياً (لحل خطأ Missing appId)
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.munir.abuzahra",
            "appName": "Abu Zahra",
            "webDir": "public"
          }
          EOF

          # 3. بناء الأندرويد من الصفر
          rm -rf android
          npx cap add android
          
          # 4. حقن المانيفست (حل الأذونات والرجوع من جوجل)
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.WRITE_CONTACTS" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:label="Abu Zahra" android:theme="@style/AppTheme">
                  <activity android:name="com.munir.abuzahra.MainActivity" android:exported="true" android:launchMode="singleTask" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.munir.abuzahra" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. ضبط رقم الإصدار 3.9.60
          sed -i 's/versionCode [0-9]*/versionCode 30960/' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "3.9.60"/' android/app/build.gradle
          
          npx cap sync android

      - name: 🔥 Extract SHA-1 (VERY IMPORTANT)
        run: |
          cd android && ./gradlew signingReport

      - name: Build Final APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-v3.9.60
          path: android/app/build/outputs/apk/debug/app-debug.apk
