name: Build Android APK

on:
  push:
    branches: [ "main", "master", "Push" ] # أضفنا Push لأن هذا اسم فرعك في الصور

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK
        run: |
          # الدخول للمجلد الذي يحتوي على ملفاتك (public)
          cd public
          
          # إعداد متغيرات الجافا لتجنب الأسئلة
          export JAVA_HOME=$JAVA_HOME_17_X64
          
          # تنفيذ الأمر مع تجاوز الأسئلة وتوليد مفتاح وهمي للبناء السريع
          yes | bubblewrap init --manifest=manifest.json --no-prompt || true
          
          # بناء التطبيق (استخدام حيلة الـ yes لتخطي كلمات السر)
          yes | bubblewrap build --no-prompt || true
          
          # البحث عن أي ملف apk تم إنتاجه ونقله للخارج باسم واضح
          find . -name "*.apk" -exec mv {} ../AbuZahra_Final.apk \;
          cd ..

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-Android-App
          path: AbuZahra_Final.apk
          if-no-files-found: error

