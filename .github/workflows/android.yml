name: Abu Zahra Pro Final 4.1.5

on:
  push:
    branches: [ "main", "Push" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Clean Environment
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/contacts --force
          rm -rf android
          echo '{"appId": "com.munir.abuzahra", "appName": "Abu Zahra", "webDir": "public"}' > capacitor.config.json
          npx cap add android
          
      - name: Force Permissions & Version 4.1.5
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # إضافة الأذونات المطلوبة (تظهر في الإعدادات وتُطلب عند التشغيل)
          sed -i '/<application/i <uses-permission android:name="android.permission.READ_CONTACTS" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.WRITE_CONTACTS" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.CALL_PHONE" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.SEND_SMS" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.READ_PHONE_STATE" />' $MANIFEST
          
          # تحديث رقم الإصدار ليظهر 4.1.5
          GRADLE="android/app/build.gradle"
          sed -i 's/versionCode [0-9]*/versionCode 40105/' $GRADLE
          sed -i 's/versionName "[^"]*"/versionName "4.1.5"/' $GRADLE
          
          # حل مشكلة Duplicate Class نهائياً عبر تعطيل استدعاء المكتبات المتعارضة
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # إجبار المشروع على استخدام نسخة موحدة من Kotlin
          printf "allprojects {\n    configurations.all {\n        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'\n    }\n}\n" >> android/build.gradle
          
          npx cap sync android

      - name: Build Pro APK
        run: |
          cd android
          chmod +x gradlew
          # تنظيف وبناء مع استبعاد المهام المسببة للتعارض
          ./gradlew clean assembleDebug -x test --no-daemon

      - name: Upload Final Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-v4.1.5-SUCCESS
          path: android/app/build/outputs/apk/debug/app-debug.apk
