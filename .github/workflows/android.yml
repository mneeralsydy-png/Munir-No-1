name: Abu Zahra Final Fix 4.1.9

on:
  push:
    branches: [ "main", "Push" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Reset & Clean Install
        run: |
          # تصحيح أمر التثبيت لتجنب خطأ 404 الذي ظهر في الصورة
          npm install @capacitor/cli @capacitor/core @capacitor/android --force
          npm install @capacitor-community/contacts --force
          rm -rf android
          echo '{"appId": "com.munir.abuzahra", "appName": "Abu Zahra", "webDir": "public"}' > capacitor.config.json
          npx cap add android

      - name: Fix Redirect & Hard Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # حقن الأذونات لضمان ظهور نوافذ "السماح" (ميكروفون، أسماء، هاتف)
          sed -i '/<application/i <uses-permission android:name="android.permission.READ_CONTACTS" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.RECORD_AUDIO" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.CALL_PHONE" />' $MANIFEST
          
          # حل مشكلة العودة للتطبيق بعد تسجيل دخول جوجل (Firebase Redirect)
          sed -i '/<activity/a \            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="com.munir.abuzahra" />\n            </intent-filter>' $MANIFEST

          # تحديث الإصدار لـ 4.1.9 لضمان تنظيف ذاكرة الجوال
          GRADLE="android/app/build.gradle"
          sed -i 's/versionCode [0-9]*/versionCode 40109/' $GRADLE
          sed -i 's/versionName "[^"]*"/versionName "4.1.9"/' $GRADLE

      - name: Resolve Class Conflicts
        run: |
          # حل مشكلة Duplicate Class التي ظهرت في صور GitHub السابقة
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          printf "\nallprojects {\n    configurations.all {\n        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'\n    }\n}\n" >> android/build.gradle
          npx cap sync android

      - name: Execute Professional Build
        run: |
          cd android
          chmod +x gradlew
          # بناء التطبيق مع استبعاد التعارضات المسببة للفشل
          ./gradlew clean assembleDebug -x test --no-daemon -Dorg.gradle.project.kotlin.stdlib.default.dependency=false

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-v4.1.9-FINAL
          path: android/app/build/outputs/apk/debug/app-debug.apk
