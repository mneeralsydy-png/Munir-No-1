name: Abu Zahra Final Ultimate 4.1.6

on:
  push:
    branches: [ "main", "Push" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Re-build Android Clean
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/contacts --force
          rm -rf android
          echo '{"appId": "com.munir.abuzahra", "appName": "Abu Zahra", "webDir": "public"}' > capacitor.config.json
          npx cap add android
          
      - name: Inject All Permissions (Including Microphone)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # إضافة إذن الميكروفون والأسماء وكل ما يحتاجه التطبيق
          sed -i '/<application/i <uses-permission android:name="android.permission.RECORD_AUDIO" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.READ_CONTACTS" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.WRITE_CONTACTS" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.CALL_PHONE" />' $MANIFEST
          sed -i '/<application/i <uses-permission android:name="android.permission.SEND_SMS" />' $MANIFEST
          
          # تحديث الإصدار إلى 4.1.6
          GRADLE="android/app/build.gradle"
          sed -i 's/versionCode [0-9]*/versionCode 40106/' $GRADLE
          sed -i 's/versionName "[^"]*"/versionName "4.1.5"/' $GRADLE
          
          # حل مشكلة التعارض النهائية
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          printf "allprojects {\n    configurations.all {\n        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'\n    }\n}\n" >> android/build.gradle
          
          npx cap sync android

      - name: Build Fixed APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x test --no-daemon

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-v4.1.6-WORKING
          path: android/app/build/outputs/apk/debug/app-debug.apk
