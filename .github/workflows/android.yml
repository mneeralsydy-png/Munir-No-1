name: Abu Zahra Final Fix 4.2.8

on:
  push:
    branches: [ "main", "Push" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Nuclear Clean & Reset
        run: |
          # حذف شامل للمجلدات القديمة لضمان عدم بقاء أي ترسبات برمجية
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android @capacitor-community/contacts --force
          rm -rf android
          echo '{"appId": "com.munir.abuzahra", "appName": "Abu Zahra", "webDir": "public"}' > capacitor.config.json
          npx cap add android

      - name: Create Essential Resources
        run: |
          # حل خطأ الثيم المفقود (الصورة 16)
          RES_DIR="android/app/src/main/res/values"
          mkdir -p $RES_DIR
          cat <<EOF > $RES_DIR/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">#3F51B5</item>
                  <item name="colorPrimaryDark">#303F9F</item>
                  <item name="colorAccent">#FF4081</item>
              </style>
              <style name="AppTheme.NoActionBarLauncher" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@null</item>
              </style>
          </resources>
          EOF

      - name: Write Master Manifest
        run: |
          # كتابة المانيفست لحل مشكلة جوجل والأسماء والأذونات
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.WRITE_CONTACTS" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name="com.munir.abuzahra.MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLauncher"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.munir.abuzahra" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Fix Duplicate Class Conflict
        run: |
          # الجزء الأهم: القضاء على تضارب Kotlin (الصور 17 و 18)
          GRADLE_PROPS="android/gradle.properties"
          echo "android.useAndroidX=true" > $GRADLE_PROPS
          echo "android.enableJetifier=true" >> $GRADLE_PROPS
          echo "kotlin.stdlib.default.dependency=false" >> $GRADLE_PROPS
          
          # فرض نسخة موحدة لجميع المكتبات التابعة
          BUILD_GRADLE="android/build.gradle"
          printf "\nallprojects {\n    configurations.all {\n        resolutionStrategy {\n            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'\n            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.20'\n            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jre7'\n            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jre8'\n        }\n    }\n}\n" >> $BUILD_GRADLE
          
          npx cap sync android

      - name: Execution & Build
        run: |
          cd android
          chmod +x gradlew
          # بناء APK نظيف مع تجاهل الأخطاء غير المؤثرة
          ./gradlew assembleDebug -x test --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-v4.2.8-FINAL
          path: android/app/build/outputs/apk/debug/app-debug.apk
