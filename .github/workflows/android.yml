name: Abu Zahra App - Final Smart Victory

on:
  push:
    branches: [ "main", "Push" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build & Fix All Issues
        run: |
          # 1. تثبيت الإضافات وجسر الأسماء (لحل مشكلة الصورة 26)
          npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/contacts --force
          
          # 2. تهيئة التطبيق مع تحديد الهوية والاسم (لحل مشكلة الصورة 22)
          npx cap init "Abu Zahra" "com.munir.abuzahra" --web-dir public --no-confirm || true
          
          # 3. إضافة منصة أندرويد وتحديث الجسور
          npx cap add android || true
          npx cap sync android
          
          # 4. حقن الأذونات "عند الطلب" فقط (لحل مشكلة استمرار الميكروفون)
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.WRITE_CONTACTS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CAMERA" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Abu Zahra"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name="com.munir.abuzahra.MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # مزامنة نهائية لربط جسر الأسماء بالجافا
          npx cap sync android

      - name: Build Final APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Success APK
        uses: actions/upload-artifact@v4
        with:
          name: Abu-Zahra-Smart-App
          path: android/app/build/outputs/apk/debug/app-debug.apk

