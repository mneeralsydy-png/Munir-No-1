name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK
        run: |
          cd public
          # الرد آلياً على كل الأسئلة بـ نعم (yes)
          yes | bubblewrap init --manifest=manifest.json --no-prompt || true
          yes | bubblewrap build --no-prompt || true
          
          # أهم خطوة: البحث عن أي ملف APK في كل المجلدات ونقله للواجهة
          echo "Searching for APK files..."
          find . -name "*.apk" -exec cp {} ../AbuZahra_App.apk \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Final-Android-App
          # سنرفع الملف الذي قمنا بصيده وتغيير اسمه
          path: AbuZahra_App.apk
          if-no-files-found: error

